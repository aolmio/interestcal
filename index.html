<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>အတိုးတွက်စနစ်</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link class="pwa-manifest" rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { 
            font-family: 'Inter', 'Padauk', sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            padding-top: max(1rem, env(safe-area-inset-top));
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
            padding-left: max(1rem, env(safe-area-inset-left));
            padding-right: max(1rem, env(safe-area-inset-right));
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">

    <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-2xl w-full max-w-md border border-gray-100 my-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-1">အတိုးတွက်စနစ်</h1>
        </div>

        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-indigo-600 mb-1">စာဖြင့်ရိုက်ထည့်ရန် (ဥပမာ - ၁၅သိန်း၄သောင်း)</label>
                <input type="text" id="principal-text-input" oninput="convertMyanmarTextToNumber(this.value)" class="w-full px-4 py-2.5 bg-indigo-50/40 border border-indigo-200 rounded-xl font-medium outline-none focus:ring-2 focus:ring-indigo-500 text-base" placeholder="ဆယ်သိန်း / 5သိန်း၁သောင်း">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">ချေးငွေ / အရင်းပမာဏ (ကျပ်)</label>
                <input type="text" id="principal" inputmode="numeric" pattern="[0-9]*" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl font-semibold outline-none focus:ring-2 focus:ring-indigo-500 text-lg" placeholder="ဥပမာ - 300000">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">အတိုးနှုန်း (ကျပ်)</label>
                <input type="text" id="rate" inputmode="numeric" pattern="[0-9]*" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl font-semibold outline-none focus:ring-2 focus:ring-indigo-500 text-lg" placeholder="ဥပမာ - 3">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">စတင်ပေါင်နှံသည့် ရက်စွဲ</label>
                <div class="relative">
                    <input type="text" id="start-date-text" inputmode="numeric" pattern="[0-9]*" onblur="smartFormatDate(this)" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl font-semibold outline-none focus:ring-2 focus:ring-indigo-500 text-lg pr-12" placeholder="နေ့လခုနှစ် (ဥပမာ - 2542025)">
                    <div class="absolute right-3 top-1/2 transform -translate-y-1/2 flex items-center">
                        <span class="text-xl pointer-events-none mr-1">📅</span>
                        <input type="date" id="start-date-picker" onchange="syncPickerToText('start-date-picker', 'start-date-text')" class="absolute opacity-0 w-8 h-8 cursor-pointer right-0">
                    </div>
                </div>
            </div>

            <div class="p-4 bg-indigo-50/50 rounded-xl border border-indigo-100 space-y-3">
                <div class="flex items-center justify-between">
                    <label class="block text-sm font-medium text-gray-700">လာရောက်ရွေးယူမည့် ပုံစံ</label>
                    <div class="flex space-x-4 text-xs font-bold">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="end-date-type" value="date" checked onchange="toggleEndInputType()" class="text-indigo-600 mr-1"> ရက်စွဲဖြင့်
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="end-date-type" value="duration" onchange="toggleEndInputType()" class="text-indigo-600 mr-1"> လအရေအတွက်ဖြင့်
                        </label>
                    </div>
                </div>

                <div id="end-date-input-container">
                    <div class="relative">
                        <input type="text" id="end-date-text" inputmode="numeric" pattern="[0-9]*" onblur="smartFormatDate(this)" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl font-semibold outline-none focus:ring-2 focus:ring-indigo-500 text-lg pr-12" placeholder="နေ့လခုနှစ် (ဥပမာ - 2512026)">
                        <div class="absolute right-3 top-1/2 transform -translate-y-1/2 flex items-center">
                            <span class="text-xl pointer-events-none mr-1">📅</span>
                            <input type="date" id="end-date-picker" onchange="syncPickerToText('end-date-picker', 'end-date-text')" class="absolute opacity-0 w-8 h-8 cursor-pointer right-0">
                        </div>
                    </div>
                </div>

                <div id="end-duration-input-container" class="hidden">
                    <input type="text" id="duration-months" inputmode="numeric" pattern="[0-9]*" oninput="calculateEndDateFromMonths()" class="w-full px-4 py-3 bg-white border border-gray-300 rounded-xl font-semibold outline-none focus:ring-2 focus:ring-indigo-500 text-lg" placeholder="ထားရှိမည့် လအရေအတွက် (ဥပမာ - 6)">
                </div>
            </div>

            <button onclick="toggleOptions()" class="text-sm font-semibold text-indigo-600 hover:text-indigo-800 focus:outline-none flex items-center py-1">
                <span>⚙️ ရက်စွန်းတွက်နည်း ပြောင်းရန်</span>
            </button>

            <div id="options-container" class="hidden p-4 bg-gray-50 rounded-xl border border-gray-200 space-y-3">
                <label class="flex items-center text-sm cursor-pointer py-1">
                    <input type="radio" name="day-option" value="full-month" checked class="h-5 w-5 text-indigo-600">
                    <span class="ml-3 font-semibold text-gray-700">၁ ရက်စွန်းလျှင် ၁ လစာယူရန် (Default)</span>
                </label>
                <label class="flex items-center text-sm cursor-pointer py-1">
                    <input type="radio" name="day-option" value="exact" class="h-5 w-5 text-indigo-600">
                    <span class="ml-3 font-semibold text-gray-700">ရက်အလိုက် တိတိကျကျတွက်ရန်</span>
                </label>
                <label class="flex items-center text-sm cursor-pointer py-1">
                    <input type="radio" name="day-option" value="half-month" class="h-5 w-5 text-indigo-600">
                    <span class="ml-3 font-semibold text-gray-700">လဝက် / ၁လစာ ဖြတ်ရန်</span>
                </label>
            </div>

            <div class="grid grid-cols-3 gap-2 mt-2">
                <button onclick="clearAllFields()" class="col-span-1 py-4 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-xl border border-red-200 active:scale-95 transition-all text-sm sm:text-base">အကုန်ဖျက်</button>
                <button onclick="parseAndCalculate()" class="col-span-2 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg active:scale-95 transition-all text-lg">တွက်ချက်မည်</button>
            </div>
        </div>

        <div id="error-box" class="text-red-500 text-sm text-center font-medium hidden mt-4"></div>

        <div id="result-box" class="bg-indigo-50/50 p-5 rounded-2xl border border-indigo-100 hidden mt-6 space-y-3">
            <div class="flex justify-between text-sm">
                <span class="text-gray-600">ကြာမြင့်ချိန် ကာလ:</span>
                <span id="duration-text" class="font-bold text-gray-800">-</span>
            </div>
            
            <div class="border-t border-indigo-100/50 pt-2 text-right">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600 text-left">၁ လစာ အတိုးနှုန်း:</span>
                    <span id="monthly-interest" class="font-semibold text-gray-700">-</span>
                </div>
                <div id="monthly-interest-text-mm" class="text-xs text-gray-500 font-medium mt-0.5">-</div>
            </div>
            
            <div class="border-t border-indigo-100/50 pt-2 text-right">
                <div class="flex justify-between text-sm">
                    <span class="text-gray-600 text-left">စုစုပေါင်း ကျသင့်အတိုး:</span>
                    <span id="total-interest" class="font-bold text-indigo-600 text-xl">-</span>
                </div>
                <div id="total-interest-text-mm" class="text-xs text-indigo-500 font-semibold mt-0.5">-</div>
            </div>
            
            <div class="border-t border-indigo-100/50 pt-2 text-right">
                <div class="flex justify-between text-sm items-center">
                    <span class="text-gray-600 font-medium text-left">စုစုပေါင်း (အရင်း + အတိုး):</span>
                    <span id="grand-total" class="font-extrabold text-emerald-600 text-2xl">-</span>
                </div>
                <div id="grand-total-text-mm" class="text-xs text-emerald-600 font-bold mt-0.5">-</div>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() { 
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(function(err) {
                    console.log('Service Worker Registration Failed: ', err);
                });
            }
        };

        // Text parsing logic for Myanmar words to numerical value mappings
        function convertMyanmarTextToNumber(inputText) {
            if (!inputText.trim()) {
                document.getElementById('principal').value = '';
                return;
            }

            let text = inputText.toLowerCase().replace(/\s+/g, '');

            const myanDigits = {'၀':'0','၁':'1','၂':'2','၃':'3','၄':'4','၅':'5','၆':'6','၇':'7','၈':'8','၉':'9'};
            for (let mDigit in myanDigits) {
                text = text.split(mDigit).join(myanDigits[mDigit]);
            }

            const wordsMap = {
                'တစ်': 1, 'တ': 1, 'နှစ်': 2, 'နှ': 2, 'သုံး': 3, 'လေး': 4, 'ငါး': 5,
                'ခြောက်': 6, 'ခုနစ်': 7, 'ခုနှစ်': 7, 'ရှစ်': 8, 'ကိုး': 9, 'ဆယ်': 10
            };

            function parseSegment(segmentStr) {
                if (!segmentStr) return 0;
                if (/^\d+$/.test(segmentStr)) {
                    return parseInt(segmentStr, 10);
                }
                if (wordsMap[segmentStr] !== undefined) {
                    return wordsMap[segmentStr];
                }
                let currentVal = 0;
                let remaining = segmentStr;

                if (remaining.includes('ဆယ်')) {
                    let parts = remaining.split('ဆယ်');
                    let prefixVal = parts[0] ? (wordsMap[parts[0]] || parseInt(parts[0], 10) || 1) : 1;
                    let suffixVal = parts[1] ? (wordsMap[parts[1]] || parseInt(parts[1], 10) || 0) : 0;
                    return (prefixVal * 10) + suffixVal;
                }
                return parseInt(remaining, 10) || 0;
            }

            let totalAmount = 0;
            let target = text;

            if (target.includes('သန်း')) {
                let chunks = target.split('သန်း');
                let chunkVal = chunks[0].trim();
                let multiplier = 1;

                if (chunkVal.includes('သိန်း')) {
                    let subChunks = chunkVal.split('သိန်း');
                    let lakhCount = subChunks[0] ? (wordsMap[subChunks[0]] || parseInt(subChunks[0], 10) || 1) : 1;
                    if (subChunks[1]) {
                        lakhCount = (lakhCount * 100) + parseSegment(subChunks[1]); 
                    } else {
                        lakhCount = lakhCount * 100;
                    }
                    multiplier = lakhCount * 100000;
                    totalAmount += multiplier;
                } else {
                    let textAmount = wordsMap[chunkVal] || parseInt(chunkVal, 10) || 0;
                    totalAmount += textAmount * 1000000;
                }
                target = chunks[1] || '';
            }

            if (target.includes('သိန်း')) {
                let chunks = target.split('သိန်း');
                let chunkVal = chunks[0].trim();
                
                let baseAmount = 1;
                if (chunkVal.endsWith('ထောင်')) {
                    let prefix = chunkVal.replace('ထောင်','');
                    baseAmount = (wordsMap[prefix] || parseInt(prefix, 10) || 1) * 1000;
                } else if (chunkVal.endsWith('ရာ')) {
                    let prefix = chunkVal.replace('ရာ','');
                    baseAmount = (wordsMap[prefix] || parseInt(prefix, 10) || 1) * 100;
                } else if (chunkVal.includes('ဆယ်')) {
                    baseAmount = parseSegment(chunkVal);
                } else {
                    baseAmount = wordsMap[chunkVal] || parseInt(chunkVal, 10) || (chunkVal === '' ? 1 : 0);
                }

                totalAmount += baseAmount * 100000;
                target = chunks[1] || '';
            }

            if (target.includes('သောင်း')) {
                let chunks = target.split('သောင်း');
                let chunkVal = chunks[0].trim();
                let baseAmount = wordsMap[chunkVal] || parseSegment(chunkVal) || (chunkVal === '' ? 1 : 0);
                totalAmount += baseAmount * 10000;
                target = chunks[1] || '';
            }

            if (target.includes('ထောင်')) {
                let chunks = target.split('ထောင်');
                let chunkVal = chunks[0].trim();
                let baseAmount = wordsMap[chunkVal] || parseSegment(chunkVal) || (chunkVal === '' ? 1 : 0);
                totalAmount += baseAmount * 1000;
                target = chunks[1] || '';
            }

            if (target.includes('ရာ')) {
                let chunks = target.split('ရာ');
                let chunkVal = chunks[0].trim();
                let baseAmount = wordsMap[chunkVal] || parseSegment(chunkVal) || (chunkVal === '' ? 1 : 0);
                totalAmount += baseAmount * 100;
                target = chunks[1] || '';
            }

            if (target) {
                totalAmount += parseSegment(target);
            }

            if (totalAmount > 0) {
                document.getElementById('principal').value = totalAmount;
            } else {
                let pureNum = text.replace(/\D/g, '');
                if (pureNum) {
                    document.getElementById('principal').value = pureNum;
                }
            }
        }

        // Helper function to turn raw numbers back into readable structured Burmese Text outputs
        function formatNumberToMyanmarWords(num) {
            num = Math.round(num);
            if (num === 0) return "၀ ကျပ်";

            let result = "";
            let remaining = num;

            const units = [
                { value: 10000000, label: "ကုဋေ" }, // Kept for logic safety framework handling
                { value: 1000000, label: "သန်း" },
                { value: 100000, label: "သိန်း" },
                { value: 10000, label: "သောင်း" },
                { value: 1000, label: "ထောင်" },
                { value: 100, label: "ရာ" },
                { value: 10, label: "ဆယ်" }
            ];

            // Special evaluation block for simplified higher lakh limits representations
            if (remaining >= 100000) {
                let lakhs = Math.floor(remaining / 100000);
                result += convertToMyanmarDigits(lakhs) + " သိန်း ";
                remaining %= 100000;
            }

            for (let unit of units) {
                if (unit.label === "သန်း" || unit.label === "ကုဋေ" || unit.label === "သိန်း") continue; 
                
                if (remaining >= unit.value) {
                    let count = Math.floor(remaining / unit.value);
                    result += convertToMyanmarDigits(count) + " " + unit.label + " ";
                    remaining %= unit.value;
                }
            }

            if (remaining > 0) {
                result += convertToMyanmarDigits(remaining);
            }

            return result.trim() + " ကျပ်";
        }

        function convertToMyanmarDigits(num) {
            const myanDigits = ['၀','၁','၂','၃','၄','၅','၆','၇','၈','၉'];
            return num.toString().split('').map(d => myanDigits[parseInt(d, 10)] || d).join('');
        }

        function toggleOptions() {
            document.getElementById('options-container').classList.toggle('hidden');
        }

        function toggleEndInputType() {
            const type = document.querySelector('input[name="end-date-type"]:checked').value;
            const dateContainer = document.getElementById('end-date-input-container');
            const durationContainer = document.getElementById('end-duration-input-container');
            
            if (type === 'date') {
                dateContainer.classList.remove('hidden');
                durationContainer.classList.add('hidden');
            } else {
                dateContainer.classList.add('hidden');
                durationContainer.classList.remove('hidden');
                calculateEndDateFromMonths();
            }
        }

        function syncPickerToText(pickerId, textId) {
            const picker = document.getElementById(pickerId);
            const textInput = document.getElementById(textId);
            if (picker.value) {
                const [year, month, day] = picker.value.split('-');
                textInput.value = `${day}-${month}-${year}`;
                
                if (textId === 'start-date-text' && document.querySelector('input[name="end-date-type"]:checked').value === 'duration') {
                    calculateEndDateFromMonths();
                }
            }
        }

        function calculateEndDateFromMonths() {
            const startText = document.getElementById('start-date-text');
            smartFormatDate(startText);
            const startDate = parseDateString(startText.value);
            const monthsInput = document.getElementById('duration-months').value;
            const months = parseInt(monthsInput, 10);

            if (!startDate || isNaN(months) || months <= 0) {
                document.getElementById('end-date-text').value = '';
                document.getElementById('end-date-picker').value = '';
                return;
            }

            let futureDate = new Date(startDate.getTime());
            futureDate.setMonth(futureDate.getMonth() + months);
            
            if (futureDate.getDate() !== startDate.getDate()) {
                futureDate.setDate(0);
            }

            const d = String(futureDate.getDate()).padStart(2, '0');
            const m = String(futureDate.getMonth() + 1).padStart(2, '0');
            const y = futureDate.getFullYear();

            document.getElementById('end-date-text').value = `${d}-${m}-${y}`;
            document.getElementById('end-date-picker').value = `${y}-${m}-${d}`;
        }

        function clearAllFields() {
            document.getElementById('principal-text-input').value = '';
            document.getElementById('principal').value = '';
            document.getElementById('rate').value = '';
            document.getElementById('start-date-text').value = '';
            document.getElementById('start-date-picker').value = '';
            document.getElementById('end-date-text').value = '';
            document.getElementById('end-date-picker').value = '';
            document.getElementById('duration-months').value = '';
            document.getElementById('error-box').classList.add('hidden');
            document.getElementById('result-box').classList.add('hidden');
        }

        function smartFormatDate(input) {
            let clean = input.value.replace(/\D/g, '');
            if (input.value.includes('-') || input.value.includes('/')) {
                let parts = input.value.split(/[-/]/);
                if(parts.length === 3) {
                    let d = parts[0].padStart(2, '0'); let m = parts[1].padStart(2, '0'); let y = parts[2];
                    if(y.length === 4) { input.value = `${d}-${m}-${y}`; return; }
                }
            }
            if (clean.length === 7) { 
                input.value = `${clean.slice(0, 2)}-${'0' + clean.slice(2, 3)}-${clean.slice(3, 7)}`;
            } else if (clean.length === 8) { 
                input.value = `${clean.slice(0, 2)}-${clean.slice(2, 4)}-${clean.slice(4, 8)}`;
            } else if (clean.length === 6) {
                input.value = `${'0' + clean.slice(0, 1)}-${'0' + clean.slice(1, 2)}-${clean.slice(2, 6)}`;
            }
        }

        function parseDateString(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length !== 3 || parts[2].length !== 4) return null;
            const d = parseInt(parts[0], 10); const m = parseInt(parts[1], 10) - 1; const y = parseInt(parts[2], 10);
            const dateObj = new Date(y, m, d);
            return (dateObj.getFullYear() === y && dateObj.getMonth() === m && dateObj.getDate() === d) ? dateObj : null;
        }

        function parseAndCalculate() {
            const errorBox = document.getElementById('error-box');
            const resultBox = document.getElementById('result-box');
            
            const pInput = document.getElementById('principal').value;
            const rInput = document.getElementById('rate').value;
            
            if(!pInput || !rInput) {
                errorBox.innerText = "* အချက်အလက်များ အပြည့်အစုံထည့်ပါ။";
                errorBox.classList.remove('hidden'); resultBox.classList.add('hidden'); return;
            }

            if (document.querySelector('input[name="end-date-type"]:checked').value === 'duration') {
                calculateEndDateFromMonths();
            }

            smartFormatDate(document.getElementById('start-date-text'));
            smartFormatDate(document.getElementById('end-date-text'));

            const startDate = parseDateString(document.getElementById('start-date-text').value);
            const endDate = parseDateString(document.getElementById('end-date-text').value);

            if (!startDate || !endDate || endDate < startDate) {
                errorBox.innerText = (!startDate || !endDate) ? "* ရက်စွဲပုံစံ မမှန်ပါ။" : "* ရက်စွဲ ရှေ့နောက် မှားနေပါသည်။";
                errorBox.classList.remove('hidden'); resultBox.classList.add('hidden'); return;
            }
            errorBox.classList.add('hidden');

            const principal = parseFloat(pInput) || 0;
            const rate = parseFloat(rInput) || 0;
            const dayOption = document.querySelector('input[name="day-option"]:checked').value;

            let mDiff = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth());
            let dDiff = endDate.getDate() - startDate.getDate();
            if (dDiff < 0) { mDiff--; dDiff += new Date(endDate.getFullYear(), endDate.getMonth(), 0).getDate(); }

            let durationString = `${mDiff > 0 ? mDiff + ' လ ' : ''}${dDiff > 0 ? dDiff + ' ရက်' : ''}`;
            if (mDiff === 0 && dDiff === 0) durationString = "၀ ရက် (ယနေ့)";

            const mInterest = principal * (rate / 100);
            let totalInterest = 0;

            if (dayOption === 'exact') {
                totalInterest = (mInterest * mDiff) + ((mInterest / 30) * dDiff);
            } else if (dayOption === 'half-month') {
                totalInterest = mInterest * (mDiff + (dDiff > 0 && dDiff <= 15 ? 0.5 : (dDiff > 15 ? 1 : 0)));
            } else if (dayOption === 'full-month') {
                totalInterest = mInterest * (mDiff + (dDiff > 0 ? 1 : 0));
            }

            // Setting basic numerical display properties
            document.getElementById('duration-text').innerText = durationString;
            document.getElementById('monthly-interest').innerText = mInterest.toLocaleString() + " ကျပ်";
            document.getElementById('total-interest').innerText = Math.round(totalInterest).toLocaleString() + " ကျပ်";
            document.getElementById('grand-total').innerText = Math.round(principal + totalInterest).toLocaleString() + " ကျပ်";
            
            // Assigning computed Burmese text definitions down below values elements
            document.getElementById('monthly-interest-text-mm').innerText = formatNumberToMyanmarWords(mInterest);
            document.getElementById('total-interest-text-mm').innerText = formatNumberToMyanmarWords(totalInterest);
            document.getElementById('grand-total-text-mm').innerText = formatNumberToMyanmarWords(principal + totalInterest);

            resultBox.classList.remove('hidden');
        }
    </script>
</body>
</html>
