<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>အတိုးတွက်စနစ်</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link class="pwa-manifest" rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body { 
            font-family: 'Inter', 'Padauk', sans-serif; 
            background: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        input[type="date"]::-webkit-calendar-picker-indicator {
            background: transparent;
            bottom: 0;
            color: transparent;
            cursor: pointer;
            height: auto;
            left: 0;
            position: absolute;
            right: 0;
            top: 0;
            width: auto;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        input::placeholder {
            color: #9ca3af;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 sm:p-6 md:p-8 lg:p-12">

    <main class="glass-panel w-full max-w-lg md:max-w-2xl lg:max-w-3xl rounded-[2rem] shadow-xl border border-white/50 overflow-hidden flex flex-col transition-all duration-300">
        
        <header class="bg-indigo-600 px-4 py-3 flex flex-col items-center justify-center rounded-b-[1.5rem] shadow-sm relative z-10">
            <div class="flex bg-indigo-800/50 p-1 rounded-xl w-full max-w-xs">
                <button onclick="switchTab('interest-tab')" id="tab-btn-interest" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-white bg-indigo-600 transition-all">
                    အတိုးတွက်ရန်
                </button>
                <button onclick="switchTab('calc-tab')" id="tab-btn-calc" class="flex-1 py-1.5 text-xs font-bold rounded-lg text-indigo-200 hover:text-white transition-all">
                    ဂဏန်းတွက်စက်
                </button>
            </div>
        </header>

        <section id="interest-tab" class="p-6 sm:p-8 md:p-10 space-y-5 md:space-y-6">
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm md:text-base font-semibold text-gray-700 mb-1.5 ml-1">စာဖြင့်ရိုက်ထည့်ရန် (ဥပမာ - ၁၅သိန်း၄သောင်း)</label>
                    <div class="relative">
                        <input type="text" id="principal-text-input" oninput="convertMyanmarTextToNumber(this.value)" class="w-full pl-4 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl text-sm md:text-base outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800" placeholder="ဆယ်သိန်း / 5သိန်း၁သောင်း">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm md:text-base font-semibold text-gray-700 mb-1.5 ml-1">အရင်းပမာဏ</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <span class="text-gray-400 font-medium text-lg pr-2 border-r border-gray-200">K</span>
                            </div>
                            <input type="text" id="principal" inputmode="numeric" pattern="[0-9]*" class="w-full pl-14 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-lg tracking-wide" placeholder="ဂဏန်းဖြင့် (ဥပမာ - 300000)">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm md:text-base font-semibold text-gray-700 mb-1.5 ml-1">အတိုးနှုန်း (ကျပ်)</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>
                            </div>
                            <input type="text" id="rate" inputmode="numeric" pattern="[0-9]*" class="w-full pl-12 pr-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-lg" placeholder="ဥပမာ - 3">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5 items-end">
                    <div>
                        <label class="block text-sm md:text-base font-semibold text-gray-700 mb-1.5 ml-1">စတင်ပေါင်နှံသည့် ရက်စွဲ</label>
                        <div class="relative">
                            <input type="text" id="start-date-text" inputmode="numeric" pattern="[0-9]*" onblur="smartFormatDate(this)" class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-lg pr-12" placeholder="DD-MM-YYYY">
                            <div class="absolute right-2 top-1/2 transform -translate-y-1/2 w-10 h-10 flex items-center justify-center bg-indigo-50 text-indigo-500 rounded-xl">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <input type="date" id="start-date-picker" onchange="syncPickerToText('start-date-picker', 'start-date-text')" class="absolute opacity-0 inset-0 cursor-pointer w-full h-full">
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col space-y-2">
                        <div class="bg-indigo-50/60 p-1.5 rounded-2xl flex border border-indigo-100 h-[46px] md:h-[50px]">
                            <label class="flex-1 text-center cursor-pointer relative h-full">
                                <input type="radio" name="end-date-type" value="date" checked onchange="toggleEndInputType()" class="peer hidden">
                                <div class="h-full flex items-center justify-center rounded-xl peer-checked:bg-white peer-checked:shadow-sm font-bold text-gray-500 peer-checked:text-indigo-600 transition-all text-sm">ရက်စွဲဖြင့်</div>
                            </label>
                            <label class="flex-1 text-center cursor-pointer relative h-full">
                                <input type="radio" name="end-date-type" value="duration" onchange="toggleEndInputType()" class="peer hidden">
                                <div class="h-full flex items-center justify-center rounded-xl peer-checked:bg-white peer-checked:shadow-sm font-bold text-gray-500 peer-checked:text-indigo-600 transition-all text-sm">လအရေအတွက်ဖြင့်</div>
                            </label>
                        </div>

                        <div id="end-date-input-container" class="relative">
                            <input type="text" id="end-date-text" inputmode="numeric" pattern="[0-9]*" onblur="smartFormatDate(this)" class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-lg pr-12" placeholder="ရွေးယူမည့် ရက်စွဲ">
                            <div class="absolute right-2 top-1/2 transform -translate-y-1/2 w-10 h-10 flex items-center justify-center bg-indigo-50 text-indigo-500 rounded-xl">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                                <input type="date" id="end-date-picker" onchange="syncPickerToText('end-date-picker', 'end-date-text')" class="absolute opacity-0 inset-0 cursor-pointer w-full h-full">
                            </div>
                        </div>

                        <div id="end-duration-input-container" class="hidden grid grid-cols-2 gap-3">
                            <div class="relative">
                                <input type="text" id="duration-months" inputmode="numeric" pattern="[0-9]*" oninput="calculateEndDateFromMonths()" class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-lg" placeholder="ထားရှိမည့် လ">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-gray-400">လ</span>
                            </div>
                            <div class="relative">
                                <input type="text" id="duration-days" inputmode="numeric" pattern="[0-9]*" oninput="calculateEndDateFromMonths()" class="w-full px-4 py-3.5 bg-gray-50 border border-gray-200 rounded-2xl font-bold outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-gray-800 text-lg" placeholder="ထားရှိမည့် ရက်">
                                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-gray-400">ရက်</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pt-3 pb-1 border-t border-gray-100">
                <button type="button" onclick="toggleAdvancedOptions()" class="flex items-center space-x-2 text-indigo-600 font-bold text-sm hover:text-indigo-800 transition-colors w-full justify-center bg-indigo-50 py-2.5 rounded-xl">
                    <svg id="advanced-icon" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    <span>ရက်စွန်းတွက်နည်း ပြောင်းရန်</span>
                </button>
                
                <div id="advanced-options" class="hidden mt-4 space-y-3 transition-all duration-300">
                    <label class="block text-sm font-semibold text-slate-700 text-center">ရက်စွန်းတွက်နည်း ရွေးချယ်ရန်</label>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="day-option" value="full-month" checked class="peer sr-only">
                            <div class="px-3 py-2 border-2 border-slate-200 rounded-xl peer-checked:border-indigo-600 peer-checked:bg-indigo-50 transition-all text-center">
                                <span class="block text-sm font-bold text-slate-700 peer-checked:text-indigo-700">၁ လစာ ယူရန်</span>
                                <span class="block text-xs text-slate-500 mt-1">၁ ရက်စွန်းလျှင်</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="day-option" value="half-month" class="peer sr-only">
                            <div class="px-3 py-2 border-2 border-slate-200 rounded-xl peer-checked:border-indigo-600 peer-checked:bg-indigo-50 transition-all text-center">
                                <span class="block text-sm font-bold text-slate-700 peer-checked:text-indigo-700">လဝက် / ၁လစာ</span>
                                <span class="block text-xs text-slate-500 mt-1">၁၅ရက် ထက်ကျော်လျှင်</span>
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="day-option" value="exact" class="peer sr-only">
                            <div class="px-3 py-2 border-2 border-slate-200 rounded-xl peer-checked:border-indigo-600 peer-checked:bg-indigo-50 transition-all text-center">
                                <span class="block text-sm font-bold text-slate-700 peer-checked:text-indigo-700">တိကျစွာတွက်ရန်</span>
                                <span class="block text-xs text-slate-500 mt-1">ရက်အလိုက်</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <div id="error-box" class="bg-red-50 text-red-600 p-3 rounded-2xl text-sm font-semibold hidden text-center border border-red-100 flex items-center justify-center space-x-2">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="error-message"></span>
            </div>

            <div class="grid grid-cols-12 gap-3 pt-1">
                <button onclick="clearAllFields()" class="col-span-4 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl transition-all active:scale-95 flex items-center justify-center space-x-1.5 text-sm md:text-base">
                    <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>ဖျက်မည်</span>
                </button>
                <button onclick="parseAndCalculate()" class="col-span-8 py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition-all active:scale-95 text-base md:text-lg flex items-center justify-center space-x-2">
                    <span>တွက်ချက်မည်</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
            
        </section>

        <section id="calc-tab" class="hidden p-6 sm:p-8 md:p-10 space-y-5">
            <div class="relative bg-gray-100 rounded-3xl p-5 border border-gray-200">
                <div class="flex items-center justify-between space-x-2 mb-2">
                    <button onclick="pasteToCalculator()" class="text-xs bg-indigo-50 border border-indigo-200 hover:bg-indigo-100 text-indigo-700 font-bold py-1.5 px-3 rounded-lg flex items-center space-x-1.5 active:scale-95 transition-all">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        <span>Paste</span>
                    </button>
                    <div class="flex items-center space-x-2">
                        <button onclick="copyFromCalculator()" class="text-xs bg-gray-50 border border-gray-200 hover:bg-gray-200 text-gray-700 font-bold py-1.5 px-3 rounded-lg flex items-center space-x-1.5 active:scale-95 transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                            <span>Copy</span>
                        </button>
                        <button onclick="useInInterest()" class="text-xs bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 text-emerald-700 font-bold py-1.5 px-3 rounded-lg flex items-center space-x-1.5 active:scale-95 transition-all">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                            <span>Use in Interest</span>
                        </button>
                    </div>
                </div>
                <input type="text" id="calc-display" inputmode="decimal" oninput="cleanCalcInput(this)" class="w-full bg-transparent text-right font-bold text-gray-800 text-3xl outline-none tracking-wide" placeholder="0">
                <div id="calc-history" class="text-right text-gray-400 text-sm h-5 overflow-hidden mt-1 font-semibold pr-1"></div>
            </div>

            <div class="grid grid-cols-4 gap-3.5">
                <button onclick="clearCalc()" class="py-5 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-2xl text-xl transition-all active:scale-90 col-span-2">C</button>
                <button onclick="backspaceCalc()" class="py-5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-2xl text-xl transition-all active:scale-90 col-span-2">⌫</button>
                
                <button onclick="inputCalc('%')" class="py-5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-2xl text-xl transition-all active:scale-90">%</button>
                <button onclick="inputCalc('÷')" class="py-5 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold rounded-2xl text-xl transition-all active:scale-90">÷</button>
                <button onclick="inputCalc('×')" class="py-5 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold rounded-2xl text-xl transition-all active:scale-90">×</button>
                <button onclick="inputCalc('-')" class="py-5 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold rounded-2xl text-xl transition-all active:scale-90">-</button>
                
                <button onclick="inputCalc('+')" class="py-5 bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold rounded-2xl text-xl transition-all active:scale-90 col-span-2">+</button>
                <button onclick="evaluateCalc()" class="py-5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl text-xl transition-all active:scale-90 col-span-2 shadow-lg shadow-indigo-150">=</button>
            </div>
        </section>
    </main>

    <div id="result-modal" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4 transition-all duration-300 opacity-0">
        <div id="result-sheet" class="bg-white w-full sm:max-w-md rounded-t-[2.5rem] sm:rounded-[2rem] overflow-hidden shadow-2xl transform translate-y-full transition-transform duration-300 flex flex-col max-h-[92vh] sm:max-h-[85vh]">
            
            <div class="w-12 h-1 bg-gray-300 rounded-full mx-auto mt-3 mb-1 sm:hidden shrink-0"></div>

            <div class="px-5 py-4 flex items-center justify-between shrink-0 border-b border-gray-100">
                <h2 class="text-gray-800 font-extrabold text-lg md:text-xl">တွက်ချက်မှု ရလဒ်</h2>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-gray-100 rounded-full text-gray-600 hover:bg-gray-200 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <div class="p-5 space-y-4 overflow-y-auto shrink">
                
                <div onclick="copyField('duration-text', 'ကြာမြင့်ချိန်ကာလ')" class="flex justify-between items-center pb-3 border-b border-gray-100 cursor-pointer hover:bg-gray-50 p-1.5 rounded-xl transition-all group">
                    <span class="text-base font-bold text-gray-600 flex items-center gap-1.5">
                        ကြာမြင့်ချိန်ကာလ 
                        <svg class="w-3.5 h-3.5 text-gray-400 opacity-0 group-hover:opacity-100 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                    </span>
                    <span id="duration-text" class="font-extrabold text-gray-900 text-lg"></span>
                </div>

                <div class="flex flex-row gap-4 pb-3 border-b border-gray-100">
                    <div onclick="copyField('principal-display', 'အရင်းပမာဏ')" class="flex-1 cursor-pointer hover:bg-gray-50 p-1.5 rounded-xl transition-all group">
                        <span class="text-sm font-bold text-gray-600 mb-1 flex items-center gap-1.5">
                            အရင်းပမာဏ
                            <svg class="w-3.5 h-3.5 text-gray-400 opacity-0 group-hover:opacity-100 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        </span>
                        <span id="principal-display" class="block font-extrabold text-gray-900 text-base md:text-lg"></span>
                        <span id="principal-text-mm" class="block text-xs font-semibold text-indigo-600 leading-tight mt-1.5"></span>
                    </div>
                    <div class="w-px bg-gray-200"></div>
                    <div onclick="copyField('monthly-interest', '၁ လစာ အတိုးနှုန်း')" class="flex-1 cursor-pointer hover:bg-gray-50 p-1.5 rounded-xl transition-all group">
                        <span class="text-sm font-bold text-gray-600 mb-1 flex items-center gap-1.5">
                            ၁ လစာ အတိုးနှုန်း
                            <svg class="w-3.5 h-3.5 text-gray-400 opacity-0 group-hover:opacity-100 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                        </span>
                        <span id="monthly-interest" class="block font-extrabold text-gray-900 text-base md:text-lg"></span>
                        <span id="monthly-interest-text-mm" class="block text-xs font-semibold text-indigo-600 leading-tight mt-1.5"></span>
                    </div>
                </div>

            <input type="text" id="paste-fallback-input" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 mb-4 text-lg font-semibold" placeholder="ဖိပြီး Paste လုပ်ပါ">

                <button onclick="closePasteModal()" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl text-sm transition-all">မလုပ်တော့ပါ</button>

    <div id="toast-notif" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 bg-slate-800 text-white px-5 py-2.5 rounded-full text-xs font-semibold tracking-wide shadow-lg opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2">
        <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        <span id="toast-message"></span>

    <script>
        let activePasteCallback = null;

        window.onload = function() { 
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(function(err) {});
            }
        };

        function switchTab(tabId) {
            const intTab = document.getElementById('interest-tab');
            const calcTab = document.getElementById('calc-tab');
            const btnInt = document.getElementById('tab-btn-interest');
            const btnCalc = document.getElementById('tab-btn-calc');

            if (tabId === 'interest-tab') {
                intTab.classList.remove('hidden');
                calcTab.classList.add('hidden');
                btnInt.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-white bg-indigo-600 transition-all';
                btnCalc.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-indigo-200 hover:text-white transition-all';
            } else {
                calcTab.classList.remove('hidden');
                intTab.classList.add('hidden');
                btnCalc.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-white bg-indigo-600 transition-all';
                btnInt.className = 'flex-1 py-1.5 text-xs font-bold rounded-lg text-indigo-200 hover:text-white transition-all';
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-notif');
            document.getElementById('toast-message').innerText = msg;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }

        async function pasteText(callback) {
            try {
                if (navigator.clipboard && navigator.clipboard.readText) {
                    const text = await navigator.clipboard.readText();
                    if (text) {
                        callback(text);
                        return;
                    }
                }
            } catch (err) {}
            
            activePasteCallback = callback;
            const modal = document.getElementById('paste-modal');
            const input = document.getElementById('paste-fallback-input');
            input.value = '';
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
                input.focus();
            }, 10);
        }

        function closePasteModal() {
            const modal = document.getElementById('paste-modal');
            const modalInner = modal.querySelector('div');
            modalInner.classList.remove('scale-100');
            modalInner.classList.add('scale-95');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
            activePasteCallback = null;
        }

        function confirmPasteFallback() {
            const text = document.getElementById('paste-fallback-input').value;
            if (text && activePasteCallback) {
                activePasteCallback(text);
            }
            closePasteModal();
        }

        function copyToClipboard(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("ကူးယူပြီးပါပြီ။");
            } catch (err) {
                showToast("ကူးယူရန် အဆင်မပြေပါ။");
            }
            document.body.removeChild(textArea);
        }

        function copyField(elementId, fieldName) {
            const el = document.getElementById(elementId);
            if (el) {
                let text = el.innerText;
                let textToCopy = text;
                if (elementId !== 'duration-text') {
                    textToCopy = text.replace(/[^0-9]/g, '');
                }
                copyToClipboard(textToCopy);
                showToast(fieldName + " (" + textToCopy + ") ကို ကူးယူပြီးပါပြီ။");
            }
        }

        function cleanCalcInput(el) {
            let val = el.value;
            val = val.replace(/\*/g, '×').replace(/\//g, '÷');
            el.value = val.replace(/[^0-9.+\-×÷%()]/g, '');
        }

        function inputCalc(val) {
            const display = document.getElementById('calc-display');
            if (display.value === '0') {
                display.value = val;
            } else {
                display.value += val;
            }
        }

        function clearCalc() {
            document.getElementById('calc-display').value = '';
            document.getElementById('calc-history').innerText = '';
        }

        function backspaceCalc() {
            const display = document.getElementById('calc-display');
            display.value = display.value.slice(0, -1);
        }

        function evaluateCalc() {
            const display = document.getElementById('calc-display');
            const history = document.getElementById('calc-history');
            let expression = display.value;
            if (!expression) return;
            try {
                history.innerText = expression + ' =';
                let formattedExpr = expression.replace(/×/g, '*').replace(/÷/g, '/');
                let result = Function('"use strict";return (' + formattedExpr + ')')();
                display.value = Number(parseFloat(result).toFixed(4)).toString();
            } catch (err) {
                display.value = 'Error';
            }
        }

        function pasteToCalculator() {
            pasteText((text) => {
                let cleaned = text.replace(/[^0-9.+\-*/%()]/g, '');
                cleaned = cleaned.replace(/\*/g, '×').replace(/\//g, '÷');
                if (cleaned) {
                    const display = document.getElementById('calc-display');
                    display.value += cleaned;
                    showToast("Paste လုပ်ပြီးပါပြီ");
                }
            });
        }

        function copyFromCalculator() {
            const val = document.getElementById('calc-display').value;
            if (val) {
                copyToClipboard(val);
            }
        }

        function useInInterest() {
            const val = document.getElementById('calc-display').value;
            if (val && !isNaN(parseFloat(val))) {
                document.getElementById('principal').value = Math.round(parseFloat(val));
                switchTab('interest-tab');
                showToast("အရင်းပမာဏထဲသို့ ထည့်သွင်းပြီးပါပြီ");
            } else {
                showToast("တရားဝင်သော ဂဏန်းမဟုတ်ပါ");
            }
        }

        function toggleAdvancedOptions() {
            const optionsDiv = document.getElementById('advanced-options');
            const icon = document.getElementById('advanced-icon');
            if (optionsDiv.classList.contains('hidden')) {
                optionsDiv.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                optionsDiv.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        function convertMyanmarTextToNumber(inputText) {
            if (!inputText.trim()) {
                document.getElementById('principal').value = '';
                return;
            }

            let text = inputText.toLowerCase().replace(/\s+/g, '');
            const myanDigits = {'၀':'0','၁':'1','၂':'2','၃':'3','၄':'4','၅':'5','၆':'6','၇':'7','၈':'8','၉':'9'};
            for (let mDigit in myanDigits) {
                text = text.split(mDigit).join(myanDigits[mDigit]);
            }

            const wordsMap = {
                'တစ်': 1, 'တ': 1, 'နှစ်': 2, 'နှ': 2, 'သုံး': 3, 'လေး': 4, 'ငါး': 5,
                'ခြောက်': 6, 'ခုနစ်': 7, 'ခုနှစ်': 7, 'ရှစ်': 8, 'ကိုး': 9, 'ဆယ်': 10
            };

            function parseSegment(segmentStr) {
                if (!segmentStr) return 0;
                if (/^\d+$/.test(segmentStr)) return parseInt(segmentStr, 10);
                if (wordsMap[segmentStr] !== undefined) return wordsMap[segmentStr];
                
                let remaining = segmentStr;
                if (remaining.includes('ဆယ်')) {
                    let parts = remaining.split('ဆယ်');
                    let prefixVal = parts[0] ? (wordsMap[parts[0]] || parseInt(parts[0], 10) || 1) : 1;
                    let suffixVal = parts[1] ? (wordsMap[parts[1]] || parseInt(parts[1], 10) || 0) : 0;
                    return (prefixVal * 10) + suffixVal;
                }
                return parseInt(remaining, 10) || 0;
            }

            let totalAmount = 0;
            let target = text;

            if (target.includes('သန်း')) {
                let chunks = target.split('သန်း');
                let chunkVal = chunks[0].trim();
                let multiplier = 1;

                if (chunkVal.includes('သိန်း')) {
                    let subChunks = chunkVal.split('သိန်း');
                    let lakhCount = subChunks[0] ? (wordsMap[subChunks[0]] || parseInt(subChunks[0], 10) || 1) : 1;
                    if (subChunks[1]) {
                        lakhCount = (lakhCount * 100) + parseSegment(subChunks[1]); 
                    } else {
                        lakhCount = lakhCount * 100;
                    }
                    multiplier = lakhCount * 100000;
                    totalAmount += multiplier;
                } else {
                    let textAmount = wordsMap[chunkVal] || parseInt(chunkVal, 10) || 0;
                    totalAmount += textAmount * 1000000;
                }
                target = chunks[1] || '';
            }

            if (target.includes('သိန်း')) {
                let chunks = target.split('သိန်း');
                let chunkVal = chunks[0].trim();
                let baseAmount = 1;
                
                if (chunkVal.endsWith('ထောင်')) {
                    let prefix = chunkVal.replace('ထောင်','');
                    baseAmount = (wordsMap[prefix] || parseInt(prefix, 10) || 1) * 1000;
                } else if (chunkVal.endsWith('ရာ')) {
                    let prefix = chunkVal.replace('ရာ','');
                    baseAmount = (wordsMap[prefix] || parseInt(prefix, 10) || 1) * 100;
                } else if (chunkVal.includes('ဆယ်')) {
                    baseAmount = parseSegment(chunkVal);
                } else {
                    baseAmount = wordsMap[chunkVal] || parseInt(chunkVal, 10) || (chunkVal === '' ? 1 : 0);
                }

                totalAmount += baseAmount * 100000;
                target = chunks[1] || '';
            }

            if (target.includes('သောင်း')) {
                let chunks = target.split('သောင်း');
                let chunkVal = chunks[0].trim();
                let baseAmount = wordsMap[chunkVal] || parseSegment(chunkVal) || (chunkVal === '' ? 1 : 0);
                totalAmount += baseAmount * 10000;
                target = chunks[1] || '';
            }

            if (target.includes('ထောင်')) {
                let chunks = target.split('ထောင်');
                let chunkVal = chunks[0].trim();
                let baseAmount = wordsMap[chunkVal] || parseSegment(chunkVal) || (chunkVal === '' ? 1 : 0);
                totalAmount += baseAmount * 1000;
                target = chunks[1] || '';
            }

            if (target.includes('ရာ')) {
                let chunks = target.split('ရာ');
                let chunkVal = chunks[0].trim();
                let baseAmount = wordsMap[chunkVal] || parseSegment(chunkVal) || (chunkVal === '' ? 1 : 0);
                totalAmount += baseAmount * 100;
                target = chunks[1] || '';
            }

            if (target) {
                totalAmount += parseSegment(target);
            }

            if (totalAmount > 0) {
                document.getElementById('principal').value = totalAmount;
            } else {
                let pureNum = text.replace(/\D/g, '');
                if (pureNum) {
                    document.getElementById('principal').value = pureNum;
                }
            }
        }

        function formatNumberToMyanmarWords(num) {
            num = Math.round(num);
            if (num === 0) return "၀ ကျပ်";

            let result = "";
            let remaining = num;
            const units = [
                { value: 10000000, label: "ကုဋေ" },
                { value: 1000000, label: "သန်း" },
                { value: 100000, label: "သိန်း" },
                { value: 10000, label: "သောင်း" },
                { value: 1000, label: "ထောင်" },
                { value: 100, label: "ရာ" },
                { value: 10, label: "ဆယ်" }
            ];

            if (remaining >= 100000) {
                let lakhs = Math.floor(remaining / 100000);
                result += convertToMyanmarDigits(lakhs) + " သိန်း ";
                remaining %= 100000;
            }

            for (let unit of units) {
                if (unit.label === "သန်း" || unit.label === "ကုဋေ" || unit.label === "သိန်း") continue; 
                if (remaining >= unit.value) {
                    let count = Math.floor(remaining / unit.value);
                    result += convertToMyanmarDigits(count) + " " + unit.label + " ";
                    remaining %= unit.value;
                }
            }

            if (remaining > 0) {
                result += convertToMyanmarDigits(remaining);
            }

            return result.trim() + " ကျပ်";
        }

        function convertToMyanmarDigits(num) {
            const myanDigits = ['၀','၁','၂','၃','၄','၅','၆','၇','၈','၉'];
            return num.toString().split('').map(d => myanDigits[parseInt(d, 10)] || d).join('');
        }

        function toggleEndInputType() {
            const type = document.querySelector('input[name="end-date-type"]:checked').value;
            const dateContainer = document.getElementById('end-date-input-container');
            const durationContainer = document.getElementById('end-duration-input-container');
            
            if (type === 'date') {
                dateContainer.classList.remove('hidden');
                durationContainer.classList.add('hidden');
            } else {
                dateContainer.classList.add('hidden');
                durationContainer.classList.remove('hidden');
                calculateEndDateFromMonths();
            }
        }

        function syncPickerToText(pickerId, textId) {
            const picker = document.getElementById(pickerId);
            const textInput = document.getElementById(textId);
            if (picker.value) {
                const [year, month, day] = picker.value.split('-');
                textInput.value = `${day}-${month}-${year}`;
                
                if (textId === 'start-date-text' && document.querySelector('input[name="end-date-type"]:checked').value === 'duration') {
                    calculateEndDateFromMonths();
                }
            }
        }

        function calculateEndDateFromMonths() {
            const startText = document.getElementById('start-date-text');
            if (!startText.value.trim()) return;
            smartFormatDate(startText);
            const startDate = parseDateString(startText.value);
            const monthsInput = document.getElementById('duration-months').value;
            const daysInput = document.getElementById('duration-days').value;
            const months = parseInt(monthsInput, 10) || 0;
            const days = parseInt(daysInput, 10) || 0;

            if (!startDate || (months === 0 && days === 0)) {
                document.getElementById('end-date-text').value = '';
                document.getElementById('end-date-picker').value = '';
                return;
            }

            let futureDate = new Date(startDate.getTime());
            if (months > 0) {
                futureDate.setMonth(futureDate.getMonth() + months);
                if (futureDate.getDate() !== startDate.getDate()) {
                    futureDate.setDate(0);
                }
            }
            if (days > 0) {
                futureDate.setDate(futureDate.getDate() + days);
            }

            const d = String(futureDate.getDate()).padStart(2, '0');
            const m = String(futureDate.getMonth() + 1).padStart(2, '0');
            const y = futureDate.getFullYear();

            document.getElementById('end-date-text').value = `${d}-${m}-${y}`;
            document.getElementById('end-date-picker').value = `${y}-${m}-${d}`;
        }

        function clearAllFields() {
            document.getElementById('principal-text-input').value = '';
            document.getElementById('principal').value = '';
            document.getElementById('rate').value = '';
            document.getElementById('start-date-text').value = '';
            document.getElementById('start-date-picker').value = '';
            document.getElementById('end-date-text').value = '';
            document.getElementById('end-date-picker').value = '';
            document.getElementById('duration-months').value = '';
            document.getElementById('duration-days').value = '';
            document.getElementById('error-box').classList.add('hidden');
        }

        function smartFormatDate(input) {
            let clean = input.value.replace(/\D/g, '');
            if (input.value.includes('-') || input.value.includes('/')) {
                let parts = input.value.split(/[-/]/);
                if(parts.length === 3) {
                    let d = parts[0].padStart(2, '0'); let m = parts[1].padStart(2, '0'); let y = parts[2];
                    if(y.length === 4) { input.value = `${d}-${m}-${y}`; return; }
                }
            }
            if (clean.length === 7) { 
                input.value = `${clean.slice(0, 2)}-${'0' + clean.slice(2, 3)}-${clean.slice(3, 7)}`;
            } else if (clean.length === 8) { 
                input.value = `${clean.slice(0, 2)}-${clean.slice(2, 4)}-${clean.slice(4, 8)}`;
            } else if (clean.length === 6) {
                input.value = `${'0' + clean.slice(0, 1)}-${'0' + clean.slice(1, 2)}-${clean.slice(2, 6)}`;
            }
        }

        function parseDateString(dateStr) {
            const parts = dateStr.split('-');
            if (parts.length !== 3 || parts[2].length !== 4) return null;
            const d = parseInt(parts[0], 10); const m = parseInt(parts[1], 10) - 1; const y = parseInt(parts[2], 10);
            const dateObj = new Date(y, m, d);
            return (dateObj.getFullYear() === y && dateObj.getMonth() === m && dateObj.getDate() === d) ? dateObj : null;
        }

        function openModal() {
            const modal = document.getElementById('result-modal');
            const sheet = document.getElementById('result-sheet');
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.classList.add('opacity-100');
                sheet.classList.remove('translate-y-full');
                sheet.classList.add('translate-y-0');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('result-modal');
            const sheet = document.getElementById('result-sheet');
            sheet.classList.remove('translate-y-0');
            sheet.classList.add('translate-y-full');
            modal.classList.remove('opacity-100');
            modal.classList.add('opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function parseAndCalculate() {
            const errorBox = document.getElementById('error-box');
            const errorMessage = document.getElementById('error-message');
            
            const pInput = document.getElementById('principal').value;
            const rInput = document.getElementById('rate').value;
            
            if(!pInput || !rInput) {
                errorMessage.innerText = "အချက်အလက်များ အပြည့်အစုံထည့်ပါ။";
                errorBox.classList.remove('hidden');
                return;
            }

            const principal = parseFloat(pInput) || 0;
            const rate = parseFloat(rInput) || 0;
            const dayOption = document.querySelector('input[name="day-option"]:checked').value;
            const calcType = document.querySelector('input[name="end-date-type"]:checked').value;
            const startTextVal = document.getElementById('start-date-text').value.trim();

            let mDiff = 0;
            let dDiff = 0;
            let durationString = '';

            if (calcType === 'duration' && !startTextVal) {
                const monthsInput = document.getElementById('duration-months').value;
                const daysInput = document.getElementById('duration-days').value;
                mDiff = parseFloat(monthsInput) || 0;
                dDiff = parseFloat(daysInput) || 0;

                if (mDiff === 0 && dDiff === 0) {
                    errorMessage.innerText = "လ သို့မဟုတ် ရက်အရေအတွက် ထည့်သွင်းပါ။";
                    errorBox.classList.remove('hidden');
                    return;
                }

                durationString = `${mDiff > 0 ? mDiff + ' လ ' : ''}${dDiff > 0 ? dDiff + ' ရက်' : ''}`.trim();
                errorBox.classList.add('hidden');
            } else {
                if (calcType === 'duration') {
                    calculateEndDateFromMonths();
                }

                smartFormatDate(document.getElementById('start-date-text'));
                smartFormatDate(document.getElementById('end-date-text'));

                const startDate = parseDateString(document.getElementById('start-date-text').value);
                const endDate = parseDateString(document.getElementById('end-date-text').value);

                if (!startDate || !endDate || endDate < startDate) {
                    errorMessage.innerText = (!startDate || !endDate) ? "ရက်စွဲပုံစံ မမှန်ပါ။" : "ရက်စွဲ ရှေ့နောက် မှားနေပါသည်။";
                    errorBox.classList.remove('hidden'); 
                    return;
                }
                errorBox.classList.add('hidden');

                mDiff = (endDate.getFullYear() - startDate.getFullYear()) * 12 + (endDate.getMonth() - startDate.getMonth());
                dDiff = endDate.getDate() - startDate.getDate();
                if (dDiff < 0) { mDiff--; dDiff += new Date(endDate.getFullYear(), endDate.getMonth(), 0).getDate(); }

                durationString = `${mDiff > 0 ? mDiff + ' လ ' : ''}${dDiff > 0 ? dDiff + ' ရက်' : ''}`;
                if (mDiff === 0 && dDiff === 0) durationString = "၀ ရက် (ယနေ့)";
            }

            const mInterest = principal * (rate / 100);
            let totalInterest = 0;

            if (dayOption === 'exact') {
                totalInterest = (mInterest * mDiff) + ((mInterest / 30) * dDiff);
            } else if (dayOption === 'half-month') {
                totalInterest = mInterest * (mDiff + (dDiff > 0 && dDiff <= 15 ? 0.5 : (dDiff > 15 ? 1 : 0)));
            } else if (dayOption === 'full-month') {
                totalInterest = mInterest * (mDiff + (dDiff > 0 ? 1 : 0));
            }

            document.getElementById('duration-text').innerText = durationString;
            document.getElementById('principal-display').innerText = principal.toLocaleString() + " ကျပ်";
            document.getElementById('principal-text-mm').innerText = formatNumberToMyanmarWords(principal);
            
            document.getElementById('monthly-interest').innerText = mInterest.toLocaleString() + " ကျပ်";
            document.getElementById('total-interest').innerText = Math.round(totalInterest).toLocaleString() + " ကျပ်";
            document.getElementById('grand-total').innerText = Math.round(principal + totalInterest).toLocaleString() + " ကျပ်";
            
            document.getElementById('monthly-interest-text-mm').innerText = formatNumberToMyanmarWords(mInterest);
            document.getElementById('total-interest-text-mm').innerText = formatNumberToMyanmarWords(totalInterest);
            document.getElementById('grand-total-text-mm').innerText = formatNumberToMyanmarWords(principal + totalInterest);

            openModal();
        }
    </script>
</body>
</html>
